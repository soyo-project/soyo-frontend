<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOYO - 캘린더</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/calendar.css" />
</head>
<body>
  <div class="page page-with-nav">

    <!-- 월 네비게이션 -->
    <header class="calendar-header">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
      <span class="cal-month-title" id="calMonthTitle">2026년 6월</span>
      <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
    </header>
    <div class="cal-divider"></div>

    <!-- 요일 헤더 -->
    <div class="cal-weekdays">
      <span>일</span><span>월</span><span>화</span>
      <span>수</span><span>목</span><span>금</span><span>토</span>
    </div>

    <!-- 날짜 그리드 -->
    <div class="cal-grid" id="calGrid">
      <!-- JS로 렌더링 -->
    </div>

    <!-- 선택된 날짜의 게시글 이미지 슬라이드 -->
    <div class="cal-detail" id="calDetail" style="display:none;">
      <div class="cal-slider" id="calSlider">
        <!-- 이미지 슬라이드 -->
      </div>
      <div class="cal-dots" id="calDots"></div>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="home.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      홈
    </a>
    <a href="map.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/></svg>
      지도
    </a>
    <a href="upload.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      업로드
    </a>
    <a href="calendar.html" class="active">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6" stroke="white" stroke-width="2"/><line x1="8" y1="2" x2="8" y2="6" stroke="white" stroke-width="2"/><line x1="3" y1="10" x2="21" y2="10" stroke="white" stroke-width="2"/></svg>
      캘린더
    </a>
    <a href="mypage.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      마이
    </a>
  </nav>

  <script src="../js/calendar.js"></script>
</body>
</html>
