<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOYO - 프로필 수정</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/edit-profile.css" />
</head>
<body>
  <div class="page page-with-nav">

    <header class="page-header">
      <button class="header-back" onclick="history.back()">‹</button>
      <span class="header-title">프로필 수정</span>
    </header>

    <main class="edit-profile-form">

      <!-- 프로필 사진 -->
      <div class="profile-photo-wrap">
        <div class="profile-photo-circle">
          <img id="profilePreview" src="../default-profile.jpeg" alt="프로필" />
          <label class="photo-edit-btn" for="profileImageInput">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4" fill="none" stroke="white" stroke-width="2"/>
            </svg>
          </label>
          <input type="file" id="profileImageInput" accept="image/*" style="display:none"
            onchange="previewProfileImage(event)" />
        </div>
      </div>

      <!-- 닉네임 -->
      <div class="edit-field">
        <label class="edit-field-label">닉네임</label>
        <div class="edit-field-row">
          <input type="text" id="nicknameInput" class="edit-field-input"
            placeholder="닉네임을 입력하세요" maxlength="20" readonly />
          <button class="edit-field-icon" onclick="enableEdit()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
        </div>
        <div class="edit-field-line"></div>
      </div>

      <!-- 학교 선택 -->
      <div class="edit-field">
        <label class="edit-field-label">학교</label>
        <div class="school-grid">
          <button class="school-btn active" data-school="삼육대학교" onclick="selectSchool(this)">
            삼육대학교
          </button>
          <button class="school-btn" data-school="서울여자대학교" onclick="selectSchool(this)">
            서울여자대학교
          </button>
        </div>
      </div>

    </main>

    <!-- 저장 버튼 -->
    <div class="edit-profile-footer">
      <button class="btn-primary" onclick="saveProfile()">저장</button>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="home.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      홈
    </a>
    <a href="map.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
      </svg>
      지도
    </a>
    <a href="upload.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      업로드
    </a>
    <a href="calendar.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      캘린더
    </a>
    <a href="mypage.html" class="active">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4" fill="currentColor"/>
      </svg>
      마이
    </a>
  </nav>

  <script src="../js/edit-profile.js"></script>
</body>
</html>
