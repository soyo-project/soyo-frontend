<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOYO - 홈</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/home.css" />
</head>
<body>
  <div class="page page-with-nav">

    <!-- 상단 헤더 -->
    <header class="home-header">
      <span class="home-logo">SOYO</span>
      <div class="home-header-icons">
        <button class="icon-btn" onclick="goNotifications()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 학교명 & 탭 -->
    <div class="home-school-name" id="schoolName">삼육대학교</div>

    <div class="home-tabs">
      <button class="tab-btn active" data-tab="추천" onclick="switchTab(this)">추천</button>
      <button class="tab-btn" data-tab="최신" onclick="switchTab(this)">최신</button>
      <button class="tab-btn" data-tab="저장" onclick="switchTab(this)">저장</button>
    </div>

    <!-- 검색 & 필터 -->
    <div class="search-bar">
      <div class="search-input-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" placeholder="장소, 태그 검색" id="searchInput"
          oninput="handleSearch(this.value)" />
      </div>
      <button class="filter-trigger-btn" onclick="openFilter()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="4" y1="6" x2="20" y2="6"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
          <line x1="11" y1="18" x2="13" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- 피드 목록 -->
    <main class="home-feed" id="homeFeed"></main>

  </div>

  <!-- 하단 네비게이션 -->
  <nav class="bottom-nav">
    <a href="home.html" class="active">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      홈
    </a>
    <a href="map.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
        <line x1="8" y1="2" x2="8" y2="18"/>
        <line x1="16" y1="6" x2="16" y2="22"/>
      </svg>
      지도
    </a>
    <a href="upload.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      업로드
    </a>
    <a href="calendar.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      캘린더
    </a>
    <a href="mypage.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      마이
    </a>
  </nav>

  <!-- 필터 바텀시트 -->
  <div class="modal-overlay" id="filterModal" style="display:none;" onclick="closeFilterOutside(event)">
    <div class="modal-box" id="filterBox">
      <div class="filter-header">
        <span class="filter-title">필터</span>
        <button class="filter-reset" onclick="resetFilters()">초기화</button>
      </div>
      <div class="filter-section">
        <div class="filter-section-title">분위기 태그</div>
        <div class="filter-tags" id="filterTags"></div>
      </div>
      <div class="filter-section">
        <div class="filter-section-title">정렬</div>
        <div class="filter-sort-group">
          <button class="sort-btn active" data-sort="추천순" onclick="selectSort(this)">추천순</button>
          <button class="sort-btn" data-sort="최신순" onclick="selectSort(this)">최신순</button>
          <button class="sort-btn" data-sort="좋아요순" onclick="selectSort(this)">좋아요순</button>
        </div>
      </div>
      <button class="btn-primary" style="margin-top:20px;" onclick="applyFilters()">적용하기</button>
    </div>
  </div>

  <script src="../js/home.js"></script>
</body>
</html>
