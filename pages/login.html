<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOYO - 로그인</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body>
  <div class="page login-page">
    <div class="login-logo-area">
      <h1 class="logo-text">SOYO</h1>
      <p class="logo-sub">정처 없이 천천히 거닐며 여유를 즐기다</p>
    </div>

    <div class="login-form-area">
      <div class="input-group">
        <input
          type="text"
          id="username"
          class="input-box"
          placeholder="아이디"
          autocomplete="username"
        />
      </div>
      <div class="input-group">
        <input
          type="password"
          id="password"
          class="input-box"
          placeholder="비밀번호"
          autocomplete="current-password"
        />
      </div>

      <button class="btn-primary" id="loginBtn" onclick="handleLogin()">로그인</button>

      <div class="login-links">
        <a href="#" class="login-link">비밀번호 찾기</a>
        <a href="signup-email.html" class="login-link">회원가입</a>
      </div>
    </div>
  </div>

  <script src="../js/login.js"></script>
</body>
</html>
