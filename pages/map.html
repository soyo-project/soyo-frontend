<!DOCTYPE html>

<head>

  <title>SOYO - 지도</title>
  <link rel="stylesheet" href="../css/global.css" />

      <div id="kakaoMap" style="width:100%;height:100%;"></div>
      <!-- 현위치 버튼 -->
      <button class="map-locate-btn" onclick="locateMe()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
          <circle cx="12" cy="12" r="7" stroke-dasharray="2 4"/>
        </svg>
      </button>
    </div>
 
    <!-- 하단 시트: 선택된 게시글 -->
    <div class="map-bottom-sheet" id="mapBottomSheet">
      <div class="sheet-handle"></div>
      <div class="sheet-post" id="sheetPost"></div>
    </div>
 
  </div>
 
  <nav class="bottom-nav">
    <a href="home.html">
