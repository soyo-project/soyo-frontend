<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOYO - 내 활동</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/my-activity.css" />
</head>
<body>
  <div class="page page-with-nav">

    <header class="page-header">
      <button class="header-back" onclick="history.back()">‹</button>
      <span class="header-title">내 활동</span>
    </header>

    <!-- 통계 카드 -->
    <div class="activity-stats">
      <div class="stat-card">
        <span class="stat-number" id="statPosts">0</span>
        <span class="stat-label">게시글</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-card">
        <span class="stat-number" id="statSaved">0</span>
        <span class="stat-label">저장</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-card">
        <span class="stat-number" id="statLiked">0</span>
        <span class="stat-label">좋아요</span>
      </div>
    </div>

    <!-- 최근 저장한 게시글 -->
    <section class="activity-section">
      <div class="activity-section-header">
        <span class="activity-section-title">최근 저장한 코스</span>
        <a href="home.html?tab=저장" class="activity-section-more">전체보기</a>
      </div>
      <div class="activity-scroll" id="savedList"></div>
    </section>
    
    <!-- 좋아요한 게시글 -->
    <section class="activity-section">
      <div class="activity-section-header">
        <span class="activity-section-title">좋아요한 코스</span>
      </div>
      <div class="activity-scroll" id="likedList"></div>
    </section>

    <!-- 내가 올린 게시글 -->
    <section class="activity-section">
      <div class="activity-section-header">
        <span class="activity-section-title">내가 올린 코스</span>
        <a href="my-posts.html" class="activity-section-more">전체보기</a>
      </div>
      <div class="activity-scroll" id="myPostsList"></div>
    </section>

  </div>

  <nav class="bottom-nav">
    <a href="home.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      홈
    </a>
    <a href="map.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
      </svg>
      지도
    </a>
    <a href="upload.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      업로드
    </a>
    <a href="calendar.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      캘린더
    </a>
    <a href="mypage.html" class="active">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4" fill="currentColor"/>
      </svg>
      마이
    </a>
  </nav>

  <script>
    const BASE_URL = 'http://127.0.0.1:8000';
    function loadActivity() {
      const token = localStorage.getItem('token');

      // 내 게시글
      fetch(`${BASE_URL}/api/posts/my/posts/`, {
        headers: { Authorization: `Bearer ${token}` }
      })
      .then(res => res.json())
      .then(data => {
        const posts = data.status === 'success' ? (data.data || []) : [];
        document.getElementById('statPosts').textContent = posts.length;
        renderThumbs('myPostsList', posts, '아직 올린 코스가 없어요.');
      })
      .catch(() => renderThumbs('myPostsList', [], '아직 올린 코스가 없어요.'));

      // 좋아요한 게시글 (내 활동)
      fetch(`${BASE_URL}/api/posts/my/likes/`, {
        headers: { Authorization: `Bearer ${token}` }
      })
      .then(res => res.json())
      .then(data => {
        const posts = data.status === 'success' ? (data.data || []) : [];
        document.getElementById('statLiked').textContent = posts.length;
        renderThumbs('likedList', posts, '좋아요한 코스가 없어요.');
        })
      .catch(() => renderThumbs('likedList', [], '좋아요한 코스가 없어요.'));
      
      // 북마크한 게시글
      fetch(`${BASE_URL}/api/posts/bookmarks/`, {
        headers: { Authorization: `Bearer ${token}` }
      })
      .then(res => res.json())
      .then(data => {
        const posts = data.status === 'success' ? (data.data || []) : [];
        document.getElementById('statSaved').textContent = posts.length;
        renderThumbs('savedList', posts, '저장한 코스가 없어요.');
      })
      .catch(() => renderThumbs('savedList', [], '저장한 코스가 없어요.'));
    }

    function renderThumbs(containerId, posts, emptyMsg) {
      const container = document.getElementById(containerId);
      if (posts.length === 0) {
        container.innerHTML = `<p class="activity-empty">${emptyMsg}</p>`;
        return;
      }
      container.innerHTML = posts.slice(0, 6).map(post => {
        const id    = post.post_id || post.id;
        const image = post.images?.[0] || '';
        return `
          <div class="activity-thumb" onclick="location.href='post-detail.html?id=${id}'">
            <img src="${image}" alt="${post.title}"
              onerror="this.style.background='var(--gray-200)';this.removeAttribute('src')" />
            <p>${post.title}</p>
          </div>`;
      }).join('');
    }

    loadActivity();
  </script>
</body>
</html>
