<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOYO - 내 게시글</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/home.css" />
</head>
<body>
  <div class="page page-with-nav">

    <header class="page-header">
      <button class="header-back" onclick="history.back()">‹</button>
      <span class="header-title">내 게시글</span>
    </header>

    <main class="home-feed" id="myPostsFeed"></main>

  </div>

  <nav class="bottom-nav">
    <a href="home.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      홈
    </a>
    <a href="map.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
      </svg>
      지도
    </a>
    <a href="upload.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      업로드
    </a>
    <a href="calendar.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      캘린더
    </a>
    <a href="mypage.html" class="active">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4" fill="currentColor"/>
      </svg>
      마이
    </a>
  </nav>

  <script>
    const BASE_URL = 'http://127.0.0.1:8000';
    function loadMyPosts() {
      const feed  = document.getElementById('myPostsFeed');
      const token = localStorage.getItem('token');
      fetch(`${BASE_URL}/api/posts/my/posts/`, {
        headers: { Authorization: `Bearer ${token}` }
      })
      .then(res => res.json())
      .then(data => {
        const posts = data.status === 'success' ? (data.data || []) : [];
        renderPosts(posts);
      })
      .catch(() => renderPosts([]));
    }

    function renderPosts(posts) {
      const feed = document.getElementById('myPostsFeed');

      // 렌더링
      if (posts.length === 0) {
        feed.innerHTML = `
          <div class="feed-empty">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            <p>아직 작성한 게시글이 없어요.<br>첫 번째 코스를 등록해보세요!</p>
          </div>
        `;
        return;
      }

      feed.innerHTML = posts.map(post => {
        const image = post.images?.[0] || post.image || '';
        const id    = post.post_id || post.id;
        return `
        <div class="post-card" onclick="location.href='post-detail.html?id=${id}'">
          <img class="post-card__image" src="${image}" alt="${post.title}"
            onerror="this.style.background='var(--gray-200)';this.removeAttribute('src')" />
          <div class="post-card__body">
            <div class="post-card__title">${post.title}</div>
            <div class="post-card__tags">
              ${(post.tags || []).map(t => `<span>#${t}</span>`).join('')}
            </div>
            <div class="post-card__footer">
              <div class="post-card__location">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                  <circle cx="12" cy="10" r="3"/>
                </svg>
                ${post.start_location || ''}
              </div>
              <div class="post-card__actions">
                <button class="action-btn" onclick="editPost(event, ${id})">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                  </svg>
                </button>
                <button class="action-btn" onclick="deletePost(event, ${id})">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                    <path d="M10 11v6M14 11v6"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      `}).join('');
    }

    function editPost(e, postId) {
      e.stopPropagation();
      location.href = `upload.html?edit=${postId}`;
    }

    function deletePost(e, postId) {
      e.stopPropagation();
      if (!confirm('게시글을 삭제하시겠습니까?')) return;
      const token = localStorage.getItem('token');
      fetch(`${BASE_URL}/api/posts/${postId}/`, {
        method: 'DELETE',
        headers: { Authorization: `Bearer ${token}` }
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') loadMyPosts();
        else alert(data.message || '삭제에 실패했습니다.');
      })
      .catch(() => alert('삭제에 실패했습니다.'));
    }

    loadMyPosts();
  </script>
</body>
</html>
