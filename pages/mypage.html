<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOYO - 마이페이지</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/mypage.css" />
</head>
<body>
  <div class="page page-with-nav">

    <header class="mypage-header">
      <button class="mypage-icon-btn" onclick="goSettings()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <span class="header-title">마이페이지</span>
      <button class="mypage-icon-btn" onclick="goNotifications()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </button>
    </header>

    <!-- 프로필 -->
    <div class="profile-section">
      <div class="profile-avatar-wrap">
        <img class="profile-avatar" id="profileAvatar" src="../default-profile.jpeg" alt="프로필" />
      </div>
      <div class="profile-nickname" id="profileNickname">닉네임</div>
      <button class="profile-edit-btn" onclick="goEditProfile()">내 정보 수정</button>
    </div>

    <!-- 활동 메뉴 -->
    <div class="activity-grid">
      <a href="my-activity.html" class="activity-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="activity-icon">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        <span>내 활동</span>
      </a>
      <a href="my-posts.html" class="activity-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="activity-icon">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8" fill="none" stroke="white" stroke-width="2"/>
          <line x1="16" y1="13" x2="8" y2="13" stroke="white" stroke-width="2"/>
          <line x1="16" y1="17" x2="8" y2="17" stroke="white" stroke-width="2"/>
        </svg>
        <span>내 게시글</span>
      </a>
      <a href="my-groups.html" class="activity-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="activity-icon">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22" fill="none" stroke="white" stroke-width="2"/>
        </svg>
        <span>내 그룹</span>
      </a>
      <a href="#" class="activity-item" onclick="openCreateGroupModal()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--primary)" class="activity-icon">
          <path d="M4 4l7.07 17 2.51-7.39L21 11.07z"/>
        </svg>
        <span>그룹 만들기</span>
      </a>
    </div>

    <!-- 설정 메뉴 -->
    <div class="settings-list">
      <button class="settings-item" onclick="goChangeId()">아이디 변경</button>
      <button class="settings-item" onclick="goChangePassword()">비밀번호 변경</button>
      <button class="settings-item" onclick="handleLogout()">로그아웃</button>
      <div class="settings-divider"></div>
      <button class="settings-item" onclick="goCustomerService()">고객센터</button>
      <button class="settings-item" onclick="goNotice()">공지사항</button>
    </div>

  </div>

  <!-- 그룹 만들기 모달 -->
  <div class="modal-overlay" id="createGroupModal" style="display:none;" onclick="closeCreateGroupOutside(event)">
    <div class="modal-box-center" style="position:relative;">
      <button class="modal-close-btn" onclick="closeCreateGroupModal()">✕</button>

      <div class="code-section">
        <div class="code-label">그룹 이름</div>
        <div class="code-input-row">
          <input type="text" class="code-input" id="groupNameInput" placeholder="그룹 이름을 입력하세요" maxlength="20" />
        </div>
      </div>

      <div class="code-section" style="margin-top:20px;">
        <div class="code-label">그룹 코드</div>
        <div class="code-input-row">
          <input type="text" class="code-input" id="groupCodeInput" placeholder="코드를 입력하세요" maxlength="20" />
          <button class="code-clear-btn" onclick="document.getElementById('groupCodeInput').value=''">×</button>
        </div>
      </div>

      <button class="btn-primary" style="margin-top:24px;" onclick="createGroup()">생성</button>
    </div>
  </div>

  <!-- 그룹 참여 모달 -->
  <div class="modal-overlay" id="joinGroupModal" style="display:none;" onclick="closeJoinGroupOutside(event)">
    <div class="modal-box-center" style="position:relative;">
      <button class="modal-close-btn" onclick="closeJoinGroupModal()">✕</button>

      <div class="code-section">
        <div class="code-label">그룹 코드 입력</div>
        <div class="code-input-row">
          <input type="text" class="code-input" id="joinCodeInput" placeholder="코드를 입력하세요" />
          <button class="code-clear-btn" onclick="document.getElementById('joinCodeInput').value=''">×</button>
        </div>
      </div>

      <button class="btn-primary" style="margin-top:24px;" onclick="submitJoinCode()">그룹 참여하기</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      홈
    </a>
    <a href="map.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/></svg>
      지도
    </a>
    <a href="upload.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      업로드
    </a>
    <a href="calendar.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      캘린더
    </a>
    <a href="mypage.html" class="active">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4" fill="currentColor"/></svg>
      마이
    </a>
  </nav>

  <script src="../js/mypage.js"></script>
</body>
</html>
