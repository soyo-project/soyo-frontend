<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOYO - 회원가입</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/signup.css" />
</head>
<body>
  <div class="page signup-page">
    <div class="signup-content">
 
      <!-- Step indicator -->
      <div class="step-indicator">
        <div class="step active" id="step1">1</div>
        <div class="step-line"></div>
        <div class="step" id="step2">2</div>
        <div class="step-line"></div>
        <div class="step" id="step3">3</div>
      </div>
      <div class="step-labels">
        <span class="step-label active">계정 정보</span>
        <span class="step-label">닉네임</span>
        <span class="step-label">학교</span>
      </div>
 
      <!-- Step 1: 아이디/비밀번호 -->
      <div id="stepEmail">
        <h2 class="signup-title">계정 정보를<br />입력해주세요.</h2>
 
        <div class="signup-input-area" style="margin-top:40px; display:flex; flex-direction:column; gap:20px;">
          <div class="underline-input-group">
            <input type="text" id="username" class="underline-input"
              placeholder="아이디" autocomplete="username" maxlength="20" />
          </div>
          <div class="underline-input-group">
            <input type="email" id="email" class="underline-input"
              placeholder="이메일" autocomplete="email" />
          </div>
          <div class="underline-input-group">
            <input type="password" id="password" class="underline-input"
              placeholder="비밀번호 (8자 이상)" autocomplete="new-password" />
          </div>
          <div class="underline-input-group">
            <input type="password" id="passwordConfirm" class="underline-input"
              placeholder="비밀번호 확인" autocomplete="new-password" />
          </div>
        </div>
 
        <p class="error-msg" id="emailError" style="display:none;"></p>
      </div>
 
      <!-- Step 2: 이메일 인증코드 -->
      <div id="stepVerify" style="display:none;">
        <h2 class="signup-title">인증코드를<br />입력해주세요.</h2>
        <p class="signup-desc">이메일로 발송된 6자리 코드를 입력해주세요.</p>
 
        <div class="signup-input-area" style="margin-top:80px;">
          <div class="verify-code-row">
            <input type="text" id="verifyCode" class="underline-input"
              placeholder="인증코드 6자리" maxlength="6" inputmode="numeric" />
            <button class="resend-btn" onclick="resendCode()">재발송</button>
          </div>
          <p class="verify-timer" id="verifyTimer">03:00</p>
        </div>
        <p class="error-msg" id="verifyError" style="display:none;"></p>
      </div>
 
    </div>
 
    <div class="signup-footer">
      <button class="btn-primary" id="nextBtn" onclick="handleEmailStep()">다음</button>
    </div>
  </div>
 
  <script src="../js/signup-email.js"></script>
</body>
</html>
