<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOYO - 닉네임 입력</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/signup.css" />
</head>
<body>
  <div class="page signup-page">
    <div class="signup-content">
      <h2 class="signup-title">닉네임을<br />입력해주세요.</h2>
      <p class="signup-desc">닉네임은 두 글자 이상이어야합니다.</p>

      <div class="signup-input-area">
        <div class="underline-input-group">
          <input
            type="text"
            id="nickname"
            class="underline-input"
            placeholder="닉네임"
            maxlength="20"
          />
        </div>
      </div>
    </div>

    <div class="signup-footer">
      <button class="btn-primary" id="nextBtn" onclick="handleNicknameNext()">다음</button>
    </div>
  </div>

  <script src="../js/signup-nickname.js"></script>
</body>
</html>
