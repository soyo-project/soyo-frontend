<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOYO - 게시글 작성</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/upload.css" />
</head>
<body>
  <div class="page">

    <header class="page-header">
      <button class="header-back" onclick="history.back()">‹</button>
      <span class="header-title">게시글 작성</span>
      <button class="header-action" id="submitBtn" onclick="submitPost()">등록</button>
    </header>

    <main class="upload-form">

      <!-- 사진 선택 -->
      <section class="upload-section">
        <label class="section-label">사진 선택 <span class="section-sub">(최대 5장)</span></label>
        <div class="photo-list" id="photoList">
          <label class="photo-add-btn" for="photoInput">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            <input type="file" id="photoInput" accept="image/*" multiple style="display:none" onchange="handlePhotoSelect(event)" />
          </label>
        </div>
      </section>

      <!-- 코스 제목 -->
      <section class="upload-section">
        <label class="section-label" for="courseTitle">코스 제목 <span class="required">*</span></label>
        <input type="text" id="courseTitle" class="text-input" placeholder="코스 제목을 입력하세요" maxlength="50" />
      </section>

      <!-- 내용 -->
      <section class="upload-section">
        <label class="section-label" for="content">내용</label>
        <textarea id="content" class="text-input textarea" placeholder="코스에 대해 설명해주세요" rows="3" maxlength="500"></textarea>
      </section>

      <!-- 분위기 태그 -->
      <section class="upload-section">
        <label class="section-label">분위기 태그 <span class="section-sub">(최대 5개)</span></label>
        <div class="selected-tags" id="selectedTags"></div>
        <button class="tag-add-btn" onclick="openTagModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </section>

      <!-- 거리 & 소요시간 -->
      <section class="upload-section">
        <label class="section-label">코스 정보</label>
        <div class="row-inputs">
          <div class="row-input-item">
            <label class="row-input-label" for="distance">거리 (km)</label>
            <input type="number" id="distance" class="text-input" placeholder="예) 2.3" min="0" step="0.1" />
          </div>
          <div class="row-input-item">
            <label class="row-input-label" for="duration">소요시간 (분)</label>
            <input type="number" id="duration" class="text-input" placeholder="예) 40" min="0" step="5" />
          </div>
        </div>
      </section>

      <!-- 출발지 & 도착지 -->
      <section class="upload-section">
        <label class="section-label">경로</label>
        <div class="route-inputs">
          <div class="route-input-item">
            <span class="route-dot start"></span>
            <input type="text" id="startLocation" class="text-input" placeholder="출발지 (예: 한양대 후문)" maxlength="50" />
          </div>
          <div class="route-line"></div>
          <div class="route-input-item">
            <span class="route-dot end"></span>
            <input type="text" id="endLocation" class="text-input" placeholder="도착지 (예: 응봉산)" maxlength="50" />
          </div>
        </div>
      </section>

      <!-- 공개 범위 -->
      <section class="upload-section">
        <label class="section-label">공개 범위</label>
        <div class="visibility-group">
          <button class="visibility-btn active" data-value="school" onclick="selectVisibility(this)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            학교 공개
          </button>
          <button class="visibility-btn" data-value="public" onclick="selectVisibility(this)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="2" y1="12" x2="22" y2="12"/>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
            전체 공개
          </button>
          <button class="visibility-btn" data-value="private" onclick="selectVisibility(this)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            나만 보기
          </button>
        </div>
      </section>

      <!-- 장소 선택 (카카오맵) -->
      <section class="upload-section">
        <label class="section-label">장소 선택</label>
        <p class="section-desc">지도를 클릭해서 코스 위치를 표시해주세요</p>
        <div class="location-map" id="locationMap">
          <!-- 카카오맵 SDK 로드 후 초기화 -->
        </div>
        <div class="location-selected" id="locationSelected" style="display:none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <span id="locationText">위치 선택됨</span>
          <button onclick="clearLocation()">×</button>
        </div>
      </section>

    </main>
  </div>

  <!-- 태그 선택 모달 -->
  <div class="modal-overlay" id="tagModal" style="display:none;" onclick="closeTagModalOutside(event)">
    <div class="modal-box" id="tagModalBox">
      <div class="tag-modal-header">
        <span class="tag-modal-title">분위기 태그 <span class="section-sub">(최대 5개)</span></span>
        <button class="tag-modal-close" onclick="closeTagModal()">✕</button>
      </div>
      <div class="tag-grid" id="tagGrid"></div>
    </div>
  </div>

  <!-- 카카오맵 SDK (API 키 교체 필요) -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=ff01bdc7b82041795e74de1d32a3287e&libraries=services"></script>
  <script src="../js/upload.js"></script>
</body>
</html>
